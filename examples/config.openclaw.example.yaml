# Private harness-gw configuration for the OpenClaw runtime. Every key is
# documented in src/config.ts. Copy this file outside the checkout,
# adjust the origins and the Gateway address, and keep it readable by the
# user the gateway runs as: owned by that user at mode 0600 or 0640, or by
# root at 0644, never group- or world-writable. Secrets stay in the mounted
# files this config points at; never put a secret value here.
version: 1
deploymentId: aos-openclaw-local
listen:
  host: 0.0.0.0
  port: 4100
  exposure: private-container
publicOrigin: http://127.0.0.1:3000
runtime:
  id: openclaw-default
  kind: openclaw
  baseUrl: ws://host.docker.internal:18789
  deviceIdentityFile: /run/secrets/openclaw-device-identity
  deviceTokenFile: /run/secrets/openclaw-device-token
guest:
  listen:
    host: 0.0.0.0
    port: 4101
    exposure: private-container
  publicOrigin: http://127.0.0.1:3001
  invitations:
    keys:
      - id: current
        secretFile: /run/secrets/guest-invite-signing-key
    clockSkewSeconds: 0
limits:
  activeExecutions: 256
  guestActiveExecutions: 32
  operatorEventPeers: 256
  subscriberEvents: 512
  subscriberBytes: 2097152
log:
  level: info
shutdownGraceMs: 5000
