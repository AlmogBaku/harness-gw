# Private harness-gw configuration for the Hermes runtime. Every key is
# documented in src/config.ts. Copy this file outside the checkout,
# adjust the origins and the Hermes address, and keep it readable by the
# user the gateway runs as: owned by that user at mode 0600 or 0640, or by
# root at 0644, never group- or world-writable. Secrets stay in the mounted
# files this config points at; never put a secret value here.
version: 1
deploymentId: aos-hermes-local
listen:
  host: 0.0.0.0
  port: 4100
  exposure: private-container
publicOrigin: http://127.0.0.1:3000
runtime:
  id: hermes-default
  kind: hermes
  baseUrl: http://host.docker.internal:9119
  tokenFile: /run/secrets/hermes-token
  sessionIdleMs: 300000
guest:
  listen:
    host: 0.0.0.0
    port: 4101
    exposure: private-container
  publicOrigin: http://127.0.0.1:3001
  invitations:
    keys:
      - id: current
        secretFile: /run/secrets/guest-invite-signing-key
    clockSkewSeconds: 0
# Hermes on the host registers the aos-ui tools as http://127.0.0.1:4110/mcp;
# the proxy container reaches the same server on the Compose network instead.
mcpApps:
  fallback:
    servers:
      aos-ui:
        url: http://tools-mcp:4110/mcp
limits:
  activeExecutions: 256
  guestActiveExecutions: 32
  operatorEventPeers: 256
  subscriberEvents: 512
  subscriberBytes: 2097152
log:
  level: info
shutdownGraceMs: 5000
